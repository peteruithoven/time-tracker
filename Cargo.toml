[package]
name = "time-tracker"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.92"

[dependencies]
adw = { package = "libadwaita", version = "0.9", features = ["v1_8"] }
gettext-rs = { version = "0.7", features = ["gettext-system"] }
gtk = { package = "gtk4", version = "0.11", features = ["v4_20"] }
rusqlite = { version = "0.43", features = ["bundled"] }

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
